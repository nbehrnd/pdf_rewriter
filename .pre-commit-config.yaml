# Notes:
#
# - activation | deactivation: pre-commit install | uninstall
# - use on each file: pre-commt run --all-files
# - commit without a check: git commit -m "message" --no-verify
#
# An installation by `pre-commit install` creates the local folder
# `~/.cache/pre-commit` in with the data supporting the hooks' work.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell
        args: [--config=.codespellrc]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      -  id: shellcheck
